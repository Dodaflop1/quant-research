[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research"
version = "0.1.0"
description = "Kalshi mispricing engine and an information diffusion model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Runtime dependencies are pinned in requirements.txt so that a clone reproduces
# a known-good resolution. This table intentionally lists only the loose bounds.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "SQLAlchemy>=2.0",
    "duckdb>=0.10",
    "aiohttp>=3.9",
    "praw>=7.7",
    "requests>=2.31",
    "cryptography>=42",
    "python-dotenv>=1.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "matplotlib>=3.8",
    "streamlit>=1.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "integration: requires live API credentials or stored data",
    "slow: long-running fits or ingestion",
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.black]
line-length = 90
target-version = ["py310"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["src/quant"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
